name: DevLore Saga Sync
# ─────────────────────────────────────────────────────────────────────────────
# DevLore — Your commits. Your legend.
#
# This workflow notifies the DevLore platform whenever you push code or merge a
# PR, so your saga stays up to date automatically.
#
# SETUP (one-time):
#   1. Visit https://devlore.app and sign in with GitHub
#   2. Go to Dashboard → Settings → copy your DEVLORE_TOKEN
#   3. Add it to THIS repo: Settings → Secrets → Actions → New repository secret
#      Name: DEVLORE_TOKEN
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["**"]
  pull_request:
    types: [closed]

jobs:
  notify-devlore:
    name: Update Your Legend
    runs-on: ubuntu-latest
    # Skip bot commits (dependabot, renovate, etc.)
    if: |
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      !contains(github.event.head_commit.message, '[skip devlore]')

    steps:
      - name: Notify DevLore Platform
        env:
          DEVLORE_TOKEN: ${{ secrets.DEVLORE_TOKEN }}
          DEVLORE_URL: ${{ vars.DEVLORE_URL || 'https://devlore.app' }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${DEVLORE_URL}/api/webhooks/github" \
            -H "Content-Type: application/json" \
            -H "X-DevLore-Token: ${DEVLORE_TOKEN}" \
            --data-raw '{
              "event": "${{ github.event_name }}",
              "repo": "${{ github.repository }}",
              "actor": "${{ github.actor }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "message": ${{ toJson(github.event.head_commit.message) }}
            }' \
            --max-time 10 \
            --silent)

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "202" ]; then
            echo "✨ Your legend has been updated. A new act has been written."
          elif [ "$HTTP_STATUS" = "401" ]; then
            echo "⚠️  Authentication failed. Check your DEVLORE_TOKEN secret."
            echo "   Get your token at: https://devlore.app/dashboard/settings"
          elif [ "$HTTP_STATUS" = "429" ]; then
            echo "⏳ DevLore is rate-limiting this repo. Your saga updates hourly."
          else
            echo "ℹ️  DevLore notification returned HTTP ${HTTP_STATUS}. Non-critical."
          fi
          # Always exit 0 — never fail your CI because of DevLore
          exit 0
